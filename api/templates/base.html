<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MemoGarden{% endblock %}</title>
    <!-- Precompiled Tailwind (api/static/console.css) — replaces the Play CDN:
         the CDN's runtime required <style type="text/tailwindcss"> for @apply,
         and the plain <style> block here compiled to EMPTY rules since the
         initial commit (borderless inputs, text-only buttons, chrome-less
         cards). Rebuild: see api/static/console.input.css. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='console.css') }}">
</head>
<body class="bg-gray-50 min-h-screen">
    {% block body %}

    {% endblock %}

    {% block scripts %}
    {% endblock %}
</body>
</html>
